<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#14234d 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.55 "IBM Plex Sans Arabic","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}.mu{color:var(--mu)}.ltr{direction:ltr;unicode-bidi:plaintext;text-align:start}
.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ok));display:grid;place-items:center;font-style:normal}

.card{background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}h3{margin:0 0 8px;font-size:15px}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.06);cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}.btn.p{background:linear-gradient(135deg,var(--ac),#5a8cf7);border:0;color:#fff}.btn.g{background:var(--ok);border:0;color:#04201c}.btn.d{background:rgba(229,83,61,.14);border-color:rgba(229,83,61,.45);color:#ff8f7d}.btn.s{height:34px;padding:0 12px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.55;cursor:default}
input,select,textarea{width:100%;height:44px;border-radius:12px;border:1px solid var(--ln);background:rgba(255,255,255,.05);padding:0 12px;outline:0}
textarea{height:auto;min-height:110px;padding:10px 12px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:#0b1226}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 4px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld{margin-bottom:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px;line-height:1.2}.stat span{font-size:12.5px;color:var(--mu)}
.tabs{display:flex;gap:6px;position:fixed;bottom:0;inset-inline:0;z-index:20;background:rgba(8,14,30,.92);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
.tabs button{flex:1;border:0;background:none;padding:7px 2px;border-radius:12px;color:var(--mu);font-size:11.5px;font-weight:700;cursor:pointer;display:grid;gap:2px;justify-items:center}.tabs button em{font-style:normal;font-size:19px}.tabs button.on{color:#fff;background:rgba(47,116,245,.22)}
.tabs{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;min-width:66px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{flex:none;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer;font-weight:700;font-size:13px}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--ln)}.it:first-child{border-top:0}
.code{font:700 15px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;direction:ltr;display:inline-block;background:rgba(255,255,255,.06);border-radius:9px;padding:4px 9px;user-select:all}
.bd{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 9px;border:1px solid var(--ln)}.bd.new,.bd.approved,.bd.act{background:rgba(20,184,166,.15);color:#5eead4;border-color:rgba(20,184,166,.4)}.bd.used{background:rgba(47,116,245,.16);color:#8fb4ff;border-color:rgba(47,116,245,.4)}.bd.pending{background:rgba(232,178,58,.15);color:#f5cf76;border-color:rgba(232,178,58,.4)}.bd.revoked,.bd.rejected,.bd.expired{background:rgba(229,83,61,.13);color:#ff9b8b;border-color:rgba(229,83,61,.4)}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}.bars i{flex:1;background:linear-gradient(180deg,var(--ac),rgba(47,116,245,.3));border-radius:5px 5px 2px 2px;min-height:3px}
.out{background:rgba(0,0,0,.3);border:1px dashed rgba(20,184,166,.5);border-radius:14px;padding:10px;margin-top:10px}.out .code{margin:3px 0}
#toast{position:fixed;inset-inline:0;bottom:88px;margin:auto;width:max-content;max-width:90vw;background:#e8eefc;color:#0b1226;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60}#toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:grid;place-items:center;padding:14px}.ov img{max-width:100%;max-height:80vh;border-radius:12px;background:#fff}
.gate{max-width:420px;margin:12vh auto 0;padding:0 14px}
@media(min-width:820px){.tabs{position:sticky;top:0;bottom:auto;inset-inline:auto;border:1px solid var(--ln);border-radius:16px;margin-bottom:14px;padding:6px;justify-content:flex-start}.tabs button{flex:none;grid-auto-flow:column;padding:9px 18px;font-size:14px}.wrap{padding-bottom:30px}#toast{bottom:24px}}
@media(max-width:560px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
.bd.closed{background:rgba(141,155,189,.14);color:#aab6d3;border-color:rgba(141,155,189,.4)}.rpm{white-space:pre-wrap;word-break:break-word;line-height:1.8;background:rgba(0,0,0,.25);border:1px solid var(--ln);border-radius:13px;padding:10px 12px;margin:8px 0}.kv{display:flex;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid var(--ln)}.kv:first-of-type{border-top:0}.kv>span:first-child{color:var(--mu);min-width:96px;flex:none}.kv>span:last-child{direction:ltr;unicode-bidi:plaintext;word-break:break-all;text-align:start}.ck{display:inline-flex;align-items:center;gap:6px;margin:0 12px 6px 0;color:var(--tx);font-size:14px;cursor:pointer}.ck input{width:18px;height:18px}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div id="gate" class="gate hide"></div>
<div id="app" class="wrap hide">
  <div class="top"><div class="brand"><i>🛡️</i><div>MY PROGRESS<small>لوحة المطوّر · <span class="ltr" id="who"></span></small></div></div>
    <div class="row"><button class="btn s" id="rf">تحديث</button><button class="btn s d" id="lo">خروج</button></div></div>
  <nav class="tabs" id="tabs">
    <button data-t="ov"><em>📊</em>نظرة عامة</button><button data-t="cd"><em>🎟️</em>الأكواد</button><button data-t="us"><em>👥</em>المستخدمون</button><button data-t="py"><em>🏦</em>الطلبات<b id="pb"></b></button><button data-t="rp"><em>🛟</em>البلاغات<b id="rb"></b></button><button data-t="qt"><em>⚡</em>رصيد AI</button><button data-t="ln"><em>🎓</em>التعلّم</button><button data-t="ct"><em>📣</em>المحتوى</button><button data-t="lg"><em>🧾</em>السجلات</button><button data-t="st"><em>⚙️</em>الإعدادات</button>
  </nav>
  <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const OWNER='rayanml778@gmail.com';
firebase.initializeApp({apiKey:"AIzaSyDuR-AZ5hPan6Wk5Riw34C0G3eJy3UFnio",authDomain:/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)?location.hostname:"myprogress-6b9d9.firebaseapp.com",projectId:"myprogress-6b9d9",appId:"1:683567818896:web:d1e8cd74eeaddf03689015"});
const auth=firebase.auth(),$=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PL={premium:'بريميوم',pro:'برو'},PK={w:'أسبوعي',m:'شهري'},ST={new:'جديد',used:'مستخدم',revoked:'ملغى',expired:'منتهي',pending:'قيد المراجعة',approved:'مقبول',rejected:'مرفوض'};
const dt=ms=>ms?new Date(ms).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'}):'—',dd=ms=>ms?new Date(ms).toLocaleDateString('ar',{dateStyle:'medium'}):'—',usd=c=>'$'+((+c||0)/100).toFixed(2);
const ERR={forbidden:'غير مصرّح',slow:'محاولات كثيرة، انتظر قليلًا',conf:'الخادم غير مهيّأ (FIREBASE_SA / PLAN_SECRET)',bad:'بيانات غير صالحة',none:'غير موجود',done:'تمت معالجة هذا الطلب سابقًا',busy:'الطلب قيد المعالجة',err:'خطأ في الخادم'};
const BW={need_token:'سجّل الدخول بحساب المالك أولًا',secret_missing:'ADMIN_SECRET غير موجود في الخادم: أعد نشر المشروع Redeploy بعد إضافته',secret_short:'ADMIN_SECRET أقصر من 32 حرفًا',secret_reused:'ADMIN_SECRET يطابق PLAN_SECRET أو DEV_CODE_HASH أو يحتويه: يجب أن يكون سرًّا مستقلًا',header_missing:'لم يُرسل ADMIN_SECRET',secret_mismatch:'القيمة المُدخلة لا تطابق ADMIN_SECRET على الخادم',email_mismatch:'الحساب ليس حساب المالك',lookup_failed:'فشل قراءة الحساب من Firebase (صلاحيات حساب الخدمة)',claims_failed:'فشل منح الصلاحية في Firebase (صلاحيات حساب الخدمة)'};
let tab='ov',T=0;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(T);T=setTimeout(()=>t.classList.remove('on'),ms||2600)}
async function raw(action,data,hdr){const u=auth.currentUser;if(!u)throw Object.assign(new Error('auth'),{status:401,j:{}});
  const r=await fetch('/api/admin',{method:'POST',headers:Object.assign({'content-type':'application/json',authorization:'Bearer '+await u.getIdToken()},hdr||{}),body:JSON.stringify(Object.assign({action},data||{}))});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.code||'err'),{status:r.status,j});return j}
async function api(a,d,hdr){try{return await raw(a,d,hdr)}catch(e){toast(ERR[e.message]||'تعذّر تنفيذ العملية');throw e}}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('تم النسخ ✓')}
const gate=(html)=>{$('#app').classList.add('hide');const g=$('#gate');g.classList.remove('hide');g.innerHTML=html};

// ---------- الدخول ----------
function login(msg){gate(`<div class="card"><div class="brand" style="margin-bottom:12px"><i>🛡️</i><div>لوحة المطوّر<small>للمالك فقط</small></div></div>
 <div class="fld"><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" class="ltr" value="${OWNER}"></div>
 <div class="fld"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" class="ltr"></div>
 <button class="btn p" id="go" style="width:100%">دخول</button><p class="mu" id="lm" style="margin:10px 0 0">${h(msg||'')}</p></div>`);
 const go=async()=>{$('#go').disabled=true;try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(e){$('#lm').textContent='بيانات الدخول غير صحيحة';$('#go').disabled=false}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()}}
function denied(){gate(`<div class="card"><h2>⛔ غير مصرّح</h2><p class="mu">هذه اللوحة لمالك المشروع فقط.</p><button class="btn" id="o2">تسجيل الخروج</button></div>`);$('#o2').onclick=()=>auth.signOut()}
function boot(){gate(`<div class="card"><h2>🔐 تفعيل صلاحية المالك (مرة واحدة)</h2><p class="mu">حسابك هو المالك لكن لم تُمنح له صلاحية الإدارة بعد. أدخل ADMIN_SECRET (المحفوظ في Vercel). يُرسل للخادم فقط ولا يُخزَّن في المتصفح.</p>
 <div class="fld"><input id="sec" type="password" class="ltr" autocomplete="off" placeholder="ADMIN_SECRET"></div><button class="btn p" id="bs" style="width:100%">منح الصلاحية</button>
 <button class="btn" id="o3" style="width:100%;margin-top:8px">خروج</button></div>`);
 $('#o3').onclick=()=>auth.signOut();
 $('#bs').onclick=async()=>{const v=$('#sec').value.trim();if(!v)return;$('#bs').disabled=true;
  try{await raw('bootstrap',{},{'x-admin-secret':v});await auth.currentUser.getIdToken(true);toast('تم منح الصلاحية ✓');check()}catch(e){const w=e.j&&e.j.why;toast((w&&BW[w])||(e.status===429?ERR.slow:'تعذّر المنح (HTTP '+(e.status||'؟')+(e.j&&e.j.code?' / '+e.j.code:'')+')')+(e.j&&e.j.detail&&e.j.detail!=='unknown'?' ['+e.j.detail+']':''),7000);$('#bs').disabled=false}$('#sec').value=''}}
async function check(){try{await raw('whoami');$('#gate').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=OWNER;go(tab);rbadge()}
 catch(e){if(e.status===403&&e.j&&e.j.need==='claim')boot();else if(e.status===403)denied();else gate(`<div class="card"><h2>تعذّر الاتصال</h2><p class="mu">${h(ERR[e.message]||'حاول مرة أخرى')}</p><button class="btn p" id="rt">إعادة المحاولة</button></div>`),$('#rt')&&($('#rt').onclick=check)}}
auth.onAuthStateChanged(u=>{if(!u)return login();if(String(u.email).toLowerCase()!==OWNER){return denied()}check()});

// ---------- التبويبات ----------
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};$('#rf').onclick=()=>go(tab);$('#lo').onclick=()=>auth.signOut();
function go(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#main').innerHTML='<p class="mu">جارٍ التحميل…</p>';$('#main').onclick=null;({ov,cd,us,py,st,qt,ln,ct,lg,rp})[t]().catch(()=>{$('#main').innerHTML='<p class="mu">تعذّر التحميل. اضغط تحديث.</p>'});window.scrollTo(0,0)}
const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;

async function ov(){await ov0();ovx().catch(()=>{})}
async function ov0(){const s=await api('stats'),u=s.users,b=s.subs,c=s.codes,p=s.payments,mx=Math.max(1,...u.signups14);
 $('#pb').textContent=p.pending?' ('+p.pending+')':'';
 $('#main').innerHTML=`<div class="card"><h3>المستخدمون</h3><div class="g4">${stat(u.total,'إجمالي الحسابات')}${stat(u.new7,'جدد آخر 7 أيام')}${stat(u.new30,'جدد آخر 30 يومًا')}${stat(u.active7,'نشطون آخر 7 أيام')}</div>
 <p class="mu" style="margin:10px 0 0">تسجيلات آخر 14 يومًا</p><div class="bars">${u.signups14.map(n=>`<i title="${n}" style="height:${Math.round(n/mx*100)}%"></i>`).join('')}</div></div>
 <div class="card"><h3>الاشتراكات</h3><div class="g4">${stat(b.premium,'بريميوم نشط')}${stat(b.pro,'برو نشط')}${stat(b.expired,'منتهية')}${stat(b.revoked,'ملغاة')}</div></div>
 <div class="card"><h3>أكواد التفعيل</h3><div class="g4">${stat(c.total,'الإجمالي')}${stat(c.new,'متاحة')}${stat(c.used,'مستخدمة')}${stat(c.revoked+c.expired,'ملغاة/منتهية')}</div></div>
 <div class="card"><h3>المدفوعات (التحويل البنكي)</h3><div class="g4">${stat(p.pending,'قيد المراجعة')}${stat(p.approved,'مقبولة')}${stat(p.rejected,'مرفوضة')}${stat(usd(p.revenueCents),'قيمة المقبول')}</div>
 <p class="mu" style="margin:8px 0 0;font-size:12.5px">القيمة بحسب قائمة الأسعار بالدولار. آخر 30 يومًا: ${usd(p.revenue30Cents)}.${s.partial?' (الأعداد جزئية: حسابات كثيرة)':''}</p></div>`}

let cf='all';
async function cd(){const r=await api('codes'),L=r.codes,flt=x=>cf=='all'||x.st==cf;
 $('#main').innerHTML=`<div class="card"><h2>إنشاء أكواد تفعيل</h2>
 <div class="g3"><div class="fld"><label>الباقة</label><select id="mp"><option value="premium">بريميوم</option><option value="pro">برو</option></select></div>
 <div class="fld"><label>الفترة</label><select id="mk"><option value="week">أسبوعي</option><option value="month" selected>شهري</option></select></div>
 <div class="fld"><label>العدد (1–100)</label><input id="mc" type="number" min="1" max="100" value="1" inputmode="numeric"></div></div>
 <div class="g3"><div class="fld"><label>مدة الاشتراك بالأيام</label><input id="md" type="number" min="1" max="366" placeholder="تلقائي (7 / 30)" inputmode="numeric"></div>
 <div class="fld"><label>صلاحية الكود (أيام لاستخدامه)</label><input id="mv" type="number" min="1" max="365" value="30" inputmode="numeric"></div>
 <div class="fld"><label>ملاحظة</label><input id="mn" maxlength="60" placeholder="اختياري"></div></div>
 <button class="btn p" id="mg">إنشاء</button><div id="mo"></div></div>
 <div class="card"><div class="chips" id="cc">${['all','new','used','revoked','expired'].map(k=>`<button data-k="${k}" class="${cf==k?'on':''}">${k=='all'?'الكل':ST[k]} (${k=='all'?L.length:L.filter(x=>x.st==k).length})</button>`).join('')}</div>
 <div>${L.filter(flt).map(x=>`<div class="it"><div><span class="code">${x.code?h(x.code):'•••••-•••••-•••••-'+x.id.slice(0,5).toUpperCase()}</span><div class="mu" style="font-size:12.5px;margin-top:4px"><span class="bd ${x.st}">${ST[x.st]||x.st}</span> ${PL[x.p]||x.p} · ${PK[x.k]||''} ${x.days} يوم · صالح حتى ${dd(x.xp)}${x.note?' · '+h(x.note):''}${x.user?'<br>استُخدم بواسطة <span class="ltr">'+h(x.user.email||x.user.uid)+'</span> في '+dt(x.at):''}</div></div>
 <div class="row">${x.code?`<button class="btn s" data-cp="${h(x.code)}">نسخ</button>`:''}${x.st=='new'||x.st=='used'?`<button class="btn s d" data-rv="${x.id}" data-used="${x.st=='used'?1:''}">${x.st=='used'?'إلغاء + إلغاء الاشتراك':'إلغاء'}</button>`:''}</div></div>`).join('')||'<p class="mu">لا توجد أكواد.</p>'}</div></div>`;
 $('#mg').onclick=async e=>{const b=e.target;b.disabled=true;try{const o=await api('mint',{plan:$('#mp').value,period:$('#mk').value,count:+$('#mc').value||1,days:+$('#md').value||undefined,valid_days:+$('#mv').value||30,note:$('#mn').value});
  $('#mo').innerHTML=`<div class="out"><div class="row"><b>تم إنشاء ${o.codes.length} كود (${PL[o.plan]} · ${o.days} يوم)</b><span class="sp"></span><button class="btn s" id="ca">نسخ الكل</button></div>${o.codes.map(c=>`<div class="row"><span class="code">${h(c)}</span><button class="btn s" data-cp="${h(c)}">نسخ</button></div>`).join('')}</div>`;

 if(x.k=='prompt')return `<div style="font-size:13px"><span class="mu">النطاق:</span> ${x.d=='all'?'كل الطلبات':h(LN[x.d]||x.d)}</div><div class="mu" style="font-size:12.5px;white-space:pre-wrap;margin-top:3px">قبل: ${h(x.pv)||'—'}</div><div style="font-size:12.5px;white-space:pre-wrap;margin-top:3px">بعد: ${h(x.nv)||'—'}</div>`;
 if(x.k=='grant'){const[a,b]=String(x.d||'').split(' · ');return `<div class="ltr" style="font-size:13px">${h(x.ue||x.u||'')}</div><div class="mu" style="font-size:12.5px">${PL[a]||h(a)} · ${h(b)} يوم</div>`}
 if(x.k=='revoke'||x.k=='disable'||x.k=='enable')return `<div class="ltr" style="font-size:13px">${h(x.ue||x.d||x.u||'')}</div>`;
 return x.d?`<div style="font-size:13px;white-space:pre-wrap">${h(x.d)}</div>`:''}
async function lg(){
 let body='';
 if(lgm=='er'){const r=await api('errors_list'),ks=Object.keys(r.c24);
  body=`<div class="card"><div class="row"><h3 style="margin:0">آخر 24 ساعة</h3><span class="sp"></span>${r.total?'<button class="btn s d" id="ec">مسح السجل</button>':''}</div><div class="row" style="margin-top:8px">${ks.length?ks.map(k=>`<span class="bd rejected">${h(EK[k]||k)}: ${r.c24[k]}</span>`).join(''):'<span class="mu">لا أخطاء في آخر 24 ساعة 🎉</span>'}</div></div>
  <div class="card">${r.errors.map(x=>`<div class="it" style="display:block"><div class="row"><span class="bd ${/keys|unhandled/.test(x.k)?'rejected':'pending'}">${h(EK[x.k]||x.k)}</span><span class="mu" style="font-size:12.5px">${dt(x.t)}</span></div><div class="ltr" style="font-size:13px;margin-top:5px;word-break:break-word">${h(x.m)||'—'}</div>${x.u?`<div class="mu ltr" style="font-size:12px;margin-top:2px">${h(x.u)}</div>`:''}</div>`).join('')||'<p class="mu" style="margin:0">السجل فارغ.</p>'}</div>`}
 else{const r=await api('audit_list');
  body=`<div class="card">${r.items.map(x=>`<div class="it" style="display:block"><div class="row"><span class="bd used">${AK[x.k]||h(x.k)}</span><span class="sp"></span><span class="mu" style="font-size:12.5px">${dt(x.t)}</span></div><div class="mu ltr" style="font-size:12.5px;margin:4px 0">${byTx(x.by)}</div>${audBody(x)}</div>`).join('')||'<p class="mu" style="margin:0">لا عمليات مسجّلة بعد.</p>'}</div>`}
 $('#main').innerHTML=`<div class="card"><div class="chips" id="lc" style="margin:0"><button data-k="er" class="${lgm=='er'?'on':''}">أخطاء الخادم</button><button data-k="au" class="${lgm=='au'?'on':''}">سجل عمليات الإدارة</button></div></div>`+body;
 $('#lc').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.k!=lgm){lgm=b.dataset.k;lg().catch(()=>{})}};
 const ec=$('#ec');if(ec)ec.onclick=async()=>{if(!confirm('مسح سجل الأخطاء كاملًا؟'))return;try{await api('errors_clear');toast('تم المسح ✓');lg()}catch(x){}}}

// ---------- البلاغات ----------
const CAT={ai:'مشكلة AI',credit:'مشكلة رصيد',login:'تسجيل الدخول',tech:'مشكلة تقنية',idea:'اقتراح'},RS={new:'جديد',review:'قيد المراجعة',solved:'تم الحل',closed:'مغلق'},RB={new:'new',review:'pending',solved:'used',closed:'closed'};
let rf='all';
const spn=x=>x=='unknown'?'—':(PL[x]||(x?'مجاني':'—'));
function rbadge(){raw('reports_list').then(r=>{$('#rb').textContent=r.cnt.new?' ('+r.cnt.new+')':''}).catch(()=>{})}
async function rp(){const r=await api('reports_list',{status:rf==='all'?'':rf}),c=r.cnt,tot=c.new+c.review+c.solved+c.closed;
 $('#rb').textContent=c.new?' ('+c.new+')':'';
 const chip=(k,l,n)=>`<button data-rf="${k}" class="${rf==k?'on':''}">${l} (${n})</button>`;
 $('#main').innerHTML=`<div class="card"><h2>البلاغات</h2><div class="chips">${chip('all','الكل',tot)}${['new','review','solved','closed'].map(k=>chip(k,RS[k],c[k])).join('')}</div>`+
  (r.items.map(x=>`<div class="it" data-rid="${h(x.id)}" style="cursor:pointer"><div style="min-width:0;flex:1"><div class="row"><span class="code">${h(x.ref)}</span><span class="bd ${RB[x.st]||''}">${RS[x.st]||h(x.st)}</span><span class="bd">${CAT[x.cat]||h(x.cat)}</span>${x.replied?'<span class="mu" style="font-size:12.5px">↩ تم الرد</span>':''}</div><div style="margin-top:5px;font-size:14px;word-break:break-word">${h(x.msg)}</div><div class="mu" style="font-size:12.5px;margin-top:3px"><span class="ltr">${h(x.em||'مجهول')}</span> · ${dt(x.at)}${x.anon?'':' · '+spn(x.sp)}</div></div></div>`).join('')||'<p class="mu" style="margin:0">لا بلاغات.</p>')+`</div>`;
 $('#main').onclick=e=>{const f=e.target.closest('[data-rf]');if(f){rf=f.dataset.rf;return rp()}const i=e.target.closest('[data-rid]');if(i)rpd(i.dataset.rid)}}
async function rpd(id){const o=await api('report_get',{id}),r=o.r,t=o.tech||{},q=o.q||{},anon=!r.uid;
 const kv=(k,v)=>v===undefined||v===null||v===''?'':`<div class="kv"><span>${k}</span><span>${h(v)}</span></div>`;
 const yn=v=>v===undefined?'':v?'نعم':'لا';
 const tc=kv('إصدار التطبيق',t.app)+kv('الباقة (الواجهة)',t.plan)+kv('الباقة (الخادم)',r.sp?spn(r.sp):'')+kv('الشاشة/القسم',t.view)+kv('لغة الواجهة',t.ui)+kv('لغة المتصفح',t.lang)+kv('الشاشة',t.scr)+kv('المنطقة الزمنية',t.tz)+kv('الثيم',t.theme)+kv('الشبكة',t.net)+kv('متصل',yn(t.online))+kv('PWA',yn(t.pwa))+kv('Service Worker',yn(t.sw))+kv('المتصفح',t.ua)+(t.errs&&t.errs.length?kv('أخطاء الواجهة',t.errs.join(' | ')):'');
 const qc=q.limit?kv('الرصيد المستخدم',q.used+' / '+q.limit)+(q.tl?kv('رصيد المعلّم',q.tu+' / '+q.tl):'')+kv('موعد الشحن',q.ra?dt(q.ra):'—')+kv('وقت نفاد المجاني',q.ex?dt(q.ex):''):'';
 const ec=(o.errs||[]).map(x=>`<div class="kv"><span>${dt(x.t)}</span><span>${h(x.k)}: ${h(x.m)}</span></div>`).join('');
 $('#main').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn s" id="rpb">← رجوع</button><span class="sp"></span><button class="btn s" id="rpr">تحديث</button></div>
 <div class="card"><div class="row"><span class="code" id="rpc">${h(r.ref)}</span><button class="btn s" id="rpcp">نسخ</button><span class="bd ${RB[r.st]||''}">${RS[r.st]||h(r.st)}</span><span class="bd">${CAT[r.cat]||h(r.cat)}</span></div>
 <div class="mu" style="font-size:12.5px;margin-top:6px">${dt(r.at)} · آخر تحديث ${dt(r.up)}</div><div class="rpm">${h(r.msg)}</div>
 ${kv('المستخدم',r.em||(anon?'بلاغ مجهول':''))}${kv('معرّف الحساب',r.uid)}${anon&&r.ct?`<div class="kv"><span>بريد للتواصل</span><span><a href="mailto:${h(r.ct)}" style="color:#8fb4ff">${h(r.ct)}</a></span></div>`:''}</div>
 <div class="card"><h3>التفاصيل التقنية (تلقائية)</h3>${tc||'<p class="mu" style="margin:0">لم تُرفق تفاصيل.</p>'}${qc?'<h3 style="margin-top:12px">حالة الرصيد وقت الإرسال</h3>'+qc:''}${ec?'<h3 style="margin-top:12px">آخر أخطاء الخادم لهذا الحساب</h3>'+ec:''}<p class="mu" style="font-size:12px;margin:10px 0 0">لا تحتوي البلاغات على كلمات مرور أو مفاتيح أو محادثات؛ تُحجب هذه من الخادم قبل الحفظ.</p></div>
 <div class="card"><h3>الحالة</h3><div class="chips" id="rps">${['new','review','solved','closed'].map(k=>`<button data-st="${k}" class="${r.st==k?'on':''}">${RS[k]}</button>`).join('')}</div></div>
 <div class="card"><h3>الرد على المستخدم</h3>${anon?'<p class="mu" style="margin:0">بلاغ مجهول: لا يصل الرد داخل التطبيق'+(r.ct?'، راسله على بريده أعلاه.':'، ولم يترك وسيلة تواصل.')+'</p>':`<p class="mu" style="margin:0 0 8px;font-size:12.5px">يظهر الرد للمستخدم في «بلاغاتي» داخل التطبيق${r.rat?' · آخر رد '+dt(r.rat):''}.</p><textarea id="rpt" maxlength="1500" placeholder="اكتب ردك…">${h(r.rep)}</textarea><div class="row" style="margin-top:10px"><select id="rpst" style="width:auto"><option value="">الحالة بعد الرد: ${r.st=='new'?'قيد المراجعة':'كما هي'}</option><option value="review">قيد المراجعة</option><option value="solved">تم الحل</option><option value="closed">مغلق</option></select><button class="btn p" id="rps2">إرسال الرد</button></div>`}</div>
 <div class="card"><h3>ملاحظة خاصة (لا تظهر للمستخدم)</h3><textarea id="rpn" maxlength="1500" style="min-height:70px">${h(r.nt)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="rpns">حفظ الملاحظة</button></div></div>`;
 $('#main').onclick=null;
 $('#rpb').onclick=()=>rp();$('#rpr').onclick=()=>rpd(id);$('#rpcp').onclick=()=>copy(r.ref);
 $('#rps').onclick=async e=>{const b=e.target.closest('[data-st]');if(!b||b.dataset.st==r.st)return;try{await api('report_set',{id,st:b.dataset.st});toast('تم تغيير الحالة ✓');rbadge();rpd(id)}catch(x){}};
 const sb=$('#rps2');if(sb)sb.onclick=async()=>{const t=$('#rpt').value.trim();if(!t){toast('اكتب الرد أولًا');return}sb.disabled=true;try{await api('report_reply',{id,text:t,st:$('#rpst').value||undefined});toast('تم إرسال الرد ✓');rbadge();rpd(id)}catch(x){sb.disabled=false}};
 $('#rpns').onclick=async()=>{try{await api('report_note',{id,text:$('#rpn').value});toast('تم الحفظ ✓')}catch(x){}}}

// ---------- حدود اللغات (قسم داخل تبويب رصيد AI) ----------

// ---------- ميزات التعلّم: أعلام التشغيل + مراقبة الأخطاء ونقاط الضعف والوسوم والأزرار ----------
async function ln(){const o=await api('learn_get'),F=o.flags,days=o.days||[];
 const sum={},wk={};for(const d of days){for(const[k,v]of Object.entries(d.c||{}))sum[k]=(sum[k]||0)+(+v||0);for(const[k,v]of Object.entries(d.w||{}))wk[k]=(wk[k]||0)+(+v||0)}
 const n=k=>sum[k]||0,pc=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
 const FL=[['wk','تتبّع نقاط الضعف','حفظ نقاط الضعف والأخطاء المحدّدة من تصحيحات Moon AI والتمارين (وتمرير آخر الأخطاء للمعلّم).'],['btn','أزرار الدروس في المحادثة','أزرار «افتح الدرس» و«تمارين» التي يقترحها المعلّم داخل المحادثة.'],['adapt','تكيّف التمارين','«المراجعة العامة» تتحوّل لأعلى نقطة ضعف، وتُعاد الأخطاء السابقة بجمل جديدة.'],['tel','إحصاءات الاستخدام','عدّادات مجهولة بلا نصوص تغذّي هذا التبويب (أوقفها لإيقاف الجمع كليًا).']];
 const tags=n('rc')?pc(n('rt'),n('rc')):'—',valid=pc(n('tw')+n('tl'),n('tw')+n('tl')+n('ti'));
 const top=Object.entries(wk).sort((a,b)=>b[1]-a[1]).slice(0,12);
 const rows=days.map(d=>{const c=d.c||{};return `<tr><td class="ltr">${h(d.d)}</td><td>${c.rc||0}</td><td>${c.rt||0}</td><td>${c.rn||0}</td><td>${c.ti||0}</td><td>${c.bo||0}</td><td>${c.bl||0}</td><td>${c.bc||0}</td><td>${c.be||0}</td><td>${c.bf||0}</td><td>${c.ew||0}</td><td>${c.er||0}</td><td>${c.ax||0}</td></tr>`}).join('');
 $('#main').innerHTML=`<div class="card"><h2>التحكم بميزات التعلّم</h2><p class="mu" style="margin-top:0">تسري على التطبيق خلال نحو 30 ثانية (عند أول مزامنة للرصيد). التعطيل لا يحذف أي بيانات محفوظة؛ يوقف الميزة فقط.</p>
  ${FL.map(([k,t,d])=>`<label class="ck" style="display:block;margin:8px 0"><input type="checkbox" data-lf="${k}" ${F[k]?'checked':''}> <b>${t}</b><div class="mu" style="font-size:12.5px;margin:2px 0 0">${d}</div></label>`).join('')}
  <div class="row"><button class="btn p" id="lfs">حفظ الإعدادات</button></div></div>
  <div class="card"><h3>المؤشرات (آخر ${days.length} أيام)</h3><div class="g4">${stat(n('ew'),'إجابات خاطئة في التمارين')}${stat(n('er'),'أخطاء محدّدة محفوظة')}${stat(n('tw'),'وسوم ضعف مقبولة')}${stat(n('wx'),'نقاط ضعف زالت')}</div>
  <div class="g4" style="margin-top:10px">${stat(tags,'التزام AI بوسم التصحيحات')}${stat(valid,'صلاحية الوسوم')}${stat(n('ax'),'تمارين تكيّفت مع ضعف')}${stat(n('ce'),'تصحيحات ✏️ في المحادثة')}</div>
  <p class="mu" style="margin:10px 0 0;font-size:12.5px">التزام الوسوم = نسبة ردود المعلّم التي صحّحت أخطاءً ووسمتها بموضوع صالح. «بلا وسم» ارتفاعه يعني أن النموذج ينسى الوسوم (لا تُحفظ نقاط الضعف لتلك الردود).</p></div>
  <div class="card"><h3>أكثر نقاط الضعف تكرارًا</h3>${top.length?top.map(([k,v])=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span class="ltr">${h(k)}</span><b>${v}</b></div>`).join(''):'<p class="mu">لا بيانات بعد.</p>'}</div>
  <div class="card"><h3>سجلّ استخدام الأزرار والوسوم (يوميًا)</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;text-align:center"><thead><tr><th>اليوم</th><th title="ردود فيها تصحيح">ردود</th><th title="ردود وسمت التصحيح">وُسمت</th><th title="ردود بلا وسم">بلا وسم</th><th title="وسوم غير صالحة">غير صالح</th><th title="فتح درس">درس</th><th title="درس مقفل">مقفل</th><th title="درس مكتمل">مكتمل</th><th title="تمارين">تمارين</th><th title="فشل الزر">فشل</th><th>خطأ تمارين</th><th>أخطاء محفوظة</th><th>تكيّف</th></tr></thead><tbody>${rows||'<tr><td colspan="13" class="mu">لا بيانات بعد.</td></tr>'}</tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="lfc">مسح الإحصاءات</button></div></div>`;
 $('#lfs').onclick=async()=>{const fl={};document.querySelectorAll('[data-lf]').forEach(c=>{fl[c.dataset.lf]=c.checked?1:0});try{await api('learn_set',{flags:fl});toast('تم الحفظ ✓');ln()}catch(e){}};
 $('#lfc').onclick=async()=>{if(!confirm('مسح كل إحصاءات التعلّم؟ (لا تتأثر بيانات المستخدمين)'))return;try{await api('learn_clear');toast('تم المسح ✓');ln()}catch(e){}}}
async function qtl(){const o=await api('lang_get'),c=o.cfg,df=o.defaults,LN={ar:'العربية',fr:'Français',en:'English'},PN={free:'المجاني (Free)',premium:'بريميوم (Premium)',pro:'برو (Pro)'};
 const row=p=>{const lock=p=='free';return `<div class="card" style="margin-bottom:10px"><h3>${PN[p]}</h3>${lock?'<p class="mu" style="margin:0 0 8px;font-size:12.5px">المعلّم غير متاح للباقة المجانية حاليًا (يرفضه الخادم قبل فحص اللغات)، لذا لا تأثير لهذا الصف الآن. القيمة محفوظة ومعطّلة.</p>':''}<div class="fld"><label>عدد اللغات التي يختارها المستخدم</label><select data-ln="${p}" ${lock?'disabled':''}>${[0,1,2,3].map(n=>`<option value="${n}" ${c[p].n==n?'selected':''}>${n}${n==0?' (بلا لغات)':''}</option>`).join('')}</select></div><label>اللغات المسموحة</label><div>${['ar','fr','en'].map(l=>`<label class="ck"><input type="checkbox" data-lc="${p}.${l}" ${c[p].l.includes(l)?'checked':''} ${lock?'disabled':''}>${LN[l]}</label>`).join('')}</div><p class="mu" style="margin:6px 0 0;font-size:12.5px">الافتراضي: ${df[p].n} من ${df[p].l.length}</p></div>`};
 $('#main').insertAdjacentHTML('beforeend',`<div class="card" id="lgc" style="margin-top:6px"><h2>حدود اللغات</h2><p class="mu" style="margin-top:0">تُطبَّق من الخادم في كل طلب للمعلّم (وليس من الواجهة فقط) وتسري خلال نحو 30 ثانية. عند التخفيض لا تُحذف لغات المستخدمين المحفوظة، بل تُقفل وتُفتح فور عودتها ضمن الحد. قيمة Pro يجب ألا تقل عن Premium.</p>${['free','premium','pro'].map(row).join('')}<div class="row"><button class="btn p" id="lsv">حفظ حدود اللغات</button><button class="btn" id="ldf">استعادة الافتراضي</button></div></div>`);
 const rd=()=>{const r={};for(const p of['free','premium','pro']){const s=document.querySelector(`[data-ln="${p}"]`);r[p]={n:+s.value,l:['ar','fr','en'].filter(l=>document.querySelector(`[data-lc="${p}.${l}"]`).checked)}}return r};
 $('#ldf').onclick=()=>{for(const p of['premium','pro']){document.querySelector(`[data-ln="${p}"]`).value=df[p].n;['ar','fr','en'].forEach(l=>{document.querySelector(`[data-lc="${p}.${l}"]`).checked=df[p].l.includes(l)})}toast('تمت استعادة القيم الافتراضية، اضغط حفظ')};
 $('#lsv').onclick=async()=>{const r=rd();for(const p of['premium','pro'])if(r[p].n>0&&!r[p].l.length){toast('اختر لغة واحدة على الأقل لباقة '+PN[p]);return}
  if(r.pro.n<r.premium.n){toast('قيمة Pro يجب ألا تقل عن Premium');return}
  try{await api('lang_set',{cfg:r});toast('تم الحفظ ✓');qt()}catch(e){if(e.j&&e.j.why=='pro_lower')toast('قيمة Pro يجب ألا تقل عن Premium')}}}
</script>
</body>
