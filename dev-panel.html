function mfill(days,n){const m={};days.forEach(x=>{m[x.d]=x.c||{}});const out=[];for(let i=n-1;i>=0;i--){const d=iso(Date.now()-i*864e5);out.push({d,c:m[d]||{}})}return out}

const msum=(days,n,fn)=>mfill(days,n).reduce((a,x)=>a+fn(x),0);

/* ---------- الرسوم البيانية (SVG بلا مكتبات؛ تفاعلية بالمرور/اللمس) ---------- */
let DCH={},dchn=0;
function dchart(o){
 const id='c'+(++dchn),W=640,H=o.h||170,pl=40,pr=6,pt=8,pb=22,iw=W-pl-pr,ih=H-pt-pb,N=o.labels.length||1;DCH[id]=o;
 const col=['#2f74f5','#8fb4ff','#e8eefc','#14b8a6'];
 let mx=0;for(let i=0;i<N;i++){const vs=o.series.map(s=>+s.v[i]||0);mx=Math.max(mx,o.type=='stack'?vs.reduce((a,b)=>a+b,0):Math.max(0,...vs))}
 const p10=Math.pow(10,Math.floor(Math.log10(mx||1))),nm=Math.ceil((mx||1)/p10*2)/2*p10||1,Y=v=>pt+ih-(v/nm)*ih,sw=iw/N;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(o.title||'')}">`;
 for(let g=0;g<=4;g++){const v=nm*g/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".1"/><text x="${pl-5}" y="${y+3}" text-anchor="end">${o.fmt?o.fmt(v):(v>=1e3?Math.round(v/100)/10+'k':Math.round(v*10)/10)}</text>`}
 const step=Math.ceil(N/7);o.labels.forEach((l,i)=>{if(i%step==0||i==N-1)s+=`<text x="${pl+sw*(i+.5)}" y="${H-6}" text-anchor="middle">${h(o.raw?String(l):(String(l).slice(5)||l))}</text>`});
 o.series.forEach((se,si)=>{const c=se.c||col[si%4];
  if(o.type=='line'){const pts=se.v.map((v,i)=>`${pl+sw*(i+.5)},${Y(+v||0)}`);s+=`<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${pts.join(' ')}"/>`+se.v.map((v,i)=>N<=31?`<circle cx="${pl+sw*(i+.5)}" cy="${Y(+v||0)}" r="2.6" fill="${c}"/>`:'').join('')}
  else{const k=o.type=='stack'?1:o.series.length,bw=Math.max(2,sw*.66/k);se.v.forEach((v,i)=>{v=+v||0;let y0=0;if(o.type=='stack')for(let q=0;q<si;q++)y0+=+o.series[q].v[i]||0;const x=o.type=='stack'?pl+sw*(i+.5)-bw/2:pl+sw*(i+.5)-bw*k/2+bw*si,top=Y(y0+v),hh=Math.max(v>0?1.5:0,Y(y0)-top);s+=`<rect x="${x}" y="${top}" width="${bw}" height="${hh}" rx="2" fill="${c}"/>`})}});
 for(let i=0;i<N;i++)s+=`<rect class="hit" data-ci="${id}" data-i="${i}" x="${pl+sw*i}" y="${pt}" width="${sw}" height="${ih}"/>`;
 s+='</svg>';
 return `<div class="ch" id="${id}">${s}<div class="cht"></div><div class="lgd">${o.series.map((se,si)=>`<span><i style="background:${se.c||col[si%4]}"></i>${h(se.n)}</span>`).join('')}</div></div>`}
document.addEventListener('pointerover',e=>{const r=e.target.closest&&e.target.closest('rect.hit');if(!r)return;const ch=r.closest('.ch'),o=DCH[r.dataset.ci];if(!o)return;const i=+r.dataset.i,N=o.labels.length,t=ch.querySelector('.cht');

let DTB={};
function dtable(id,o){const old=DTB[id];DTB[id]={o,st:old?old.st:{q:'',p:0,sk:'',sd:1,fv:{}}};const S=DTB[id].st;
 return `<div class="tb"><input type="search" data-tq="${id}" placeholder="${h(tr('search'))}" value="${h(S.q)}" aria-label="${h(tr('search'))}">${(o.filters||[]).map(f=>`<select data-tf="${id}" data-fk="${f.k}" aria-label="${h(f.l)}"><option value="">${h(f.l)}: ${h(tr('all'))}</option>${f.opts.map(([v,l])=>`<option value="${h(v)}" ${S.fv[f.k]===v?'selected':''}>${h(l)}</option>`).join('')}</select>`).join('')}${o.csv?`<button class="btn s" data-tcsv="${id}">${h(tr('export_csv'))}</button>`:''}</div><div id="tb_${id}">${dtbody(id)}</div>`}
function dtview(id){const {o,st}=DTB[id];let r=o.rows.filter(x=>(!st.q||o.text(x).toLowerCase().includes(st.q.toLowerCase()))&&(o.filters||[]).every(f=>!st.fv[f.k]||f.f(x,st.fv[f.k])));
 if(st.sk){const c=o.cols.find(c=>c.k==st.sk);if(c&&c.v)r=r.slice().sort((a,b)=>{const x=c.v(a),y=c.v(b);return (x>y?1:x<y?-1:0)*st.sd})}return r}
function dtbody(id){const {o,st}=DTB[id],rows=dtview(id),ps=o.ps||10,pages=Math.max(1,Math.ceil(rows.length/ps));if(st.p>=pages)st.p=pages-1;const pg=rows.slice(st.p*ps,st.p*ps+ps);
 if(!rows.length)return dempty(o.empty||tr('no_rows'));
 return `<div class="tw"><table class="dt"><thead><tr>${o.cols.map(c=>`<th ${c.v?`data-ts="${id}" data-k="${c.k}" aria-sort="${st.sk==c.k?(st.sd>0?'ascending':'descending'):'none'}"`:''}>${h(c.l)}${st.sk==c.k?(st.sd>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${pg.map(r=>`<tr>${o.cols.map(c=>`<td>${c.r(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="pg"><span>${st.p*ps+1}–${Math.min(rows.length,st.p*ps+ps)} ${h(tr('of'))} ${dn(rows.length)}</span><span class="row"><button class="btn s" data-tp="${id}" data-d="-1" ${st.p<=0?'disabled':''}>${h(tr('prev'))}</button><button class="btn s" data-tp="${id}" data-d="1" ${st.p>=pages-1?'disabled':''}>${h(tr('next'))}</button></span></div>`}
const dtre=id=>{const e=document.getElementById('tb_'+id);if(e)e.innerHTML=dtbody(id)};
/* تصدير CSV: يُسجَّل في سجل النشاط من الخادم أولًا. الخلايا التي تبدأ بـ = + - @ تُحيَّد ضد حقن الصيغ */
async function dcsv(name,head,rows){try{await dq('export_log',{what:name})}catch(e){toast(emsg(e));return}
 const cell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const b=new Blob(['\ufeff'+[head].concat(rows).map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='myprogress-'+name+'-'+iso(Date.now())+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(tr('exported'))}

/* ---- أدوات نقية: تلوين، فروقات، سياسة مبدئية للعرض فقط (الخادم هو المرجع) ---- */
const fmEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HLS={
 js:{re:/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|try|catch|finally|throw|async|await|import|export|from|default|typeof|instanceof|in|of|null|true|false|undefined|this)\b|(\b\d+(?:\.\d+)?\b)/g,c:['c','s','k','n']},
 json:{re:/("(?:\\.|[^"\\\n])*")(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g,c:['s','x','k','n']},
 css:{re:/(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(@[\w-]+)|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms|deg)?\b)/g,c:['c','s','k','n']},
 html:{re:/(<!--[\s\S]*?-->)|(<\/?[A-Za-z][\w:-]*)|("[^"\n]*"|'[^'\n]*')|(\/?>)/g,c:['c','k','s','k']}};
HLS.mjs=HLS.cjs=HLS.js;HLS.webmanifest=HLS.json;HLS.htm=HLS.svg=HLS.xml=HLS.html;
function hlx(t,e){const L=HLS[e];if(!L||t.length>200000)return fmEsc(t);let out='',last=0,m;L.re.lastIndex=0;
 while((m=L.re.exec(t))){if(m[0]==='')L.re.lastIndex++;let cls='';for(let i=0;i<L.c.length;i++)if(m[i+1]!==undefined){cls=L.c[i];break}
  if(e==='json'&&m[1]!==undefined&&m[2])cls='f';
  out+=fmEsc(t.slice(last,m.index))+(cls?`<span class="tk-${cls}">${fmEsc(m[0])}</span>`:fmEsc(m[0]));last=m.index+m[0].length}
 return out+fmEsc(t.slice(last))}
/* فروقات سطرية: قص البادئة/اللاحقة المشتركة ثم LCS على الوسط */
function ldiff(a,b){const A=a.split('\n'),B=b.split('\n');let s=0;while(s<A.length&&s<B.length&&A[s]===B[s])s++;let ea=A.length,eb=B.length;while(ea>s&&eb>s&&A[ea-1]===B[eb-1]){ea--;eb--}
 const a2=A.slice(s,ea),b2=B.slice(s,eb),n=a2.length,m=b2.length,ops=[];let big=false;
 for(let i=0;i<s;i++)ops.push(['=',A[i],i+1,i+1]);
 if(n*m>4e6){big=true;a2.forEach((x,i)=>ops.push(['-',x,s+i+1,0]));b2.forEach((x,j)=>ops.push(['+',x,0,s+j+1]))}
 else{const W=m+1,dp=new Uint32Array((n+1)*W);for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a2[i]===b2[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  let i=0,j=0;while(i<n&&j<m){if(a2[i]===b2[j]){ops.push(['=',a2[i],s+i+1,s+j+1]);i++;j++}else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ops.push(['-',a2[i],s+i+1,0]);i++}else{ops.push(['+',b2[j],0,s+j+1]);j++}}
  while(i<n){ops.push(['-',a2[i],s+i+1,0]);i++}while(j<m){ops.push(['+',b2[j],0,s+j+1]);j++}}
 for(let k=0;k<A.length-ea;k++)ops.push(['=',A[ea+k],ea+k+1,eb+k+1]);
 return{ops,add:ops.filter(o=>o[0]=='+').length,del:ops.filter(o=>o[0]=='-').length,big}}
function diffHtml(a,b){if(a===b)return `<p class="mu" style="margin:0">${h(tr('fm_diff_none'))}</p>`;const d=ldiff(a,b),C=3,keep=new Uint8Array(d.ops.length);
 d.ops.forEach((o,i)=>{if(o[0]!='='){for(let k=Math.max(0,i-C);k<=Math.min(d.ops.length-1,i+C);k++)keep[k]=1}});
 let out=`<div class="row" style="margin-bottom:6px"><b class="ltr">${h(tr('fm_diff_sum',d.add,d.del))}</b>${d.big?`<span class="mu" style="font-size:12px">${h(tr('fm_diff_big'))}</span>`:''}</div><div class="dfw">`,skip=0,rows=0;
 d.ops.forEach((o,i)=>{if(!keep[i]){skip++;return}if(skip){out+=`<div class="df sk">${h(tr('fm_diff_skip',skip))}</div>`;skip=0}if(++rows>2500)return;
  out+=`<div class="df ${o[0]=='+'?'ad':o[0]=='-'?'dl':''}"><span class="ln">${o[2]||''}</span><span class="ln">${o[3]||''}</span><span class="tx">${o[0]=='='?'&nbsp;':o[0]} ${fmEsc(o[1])||'&nbsp;'}</span></div>`});
 if(skip)out+=`<div class="df sk">${h(tr('fm_diff_skip',skip))}</div>`;return out+'</div>'}
