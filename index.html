const H={halo:'<ellipse cx="60" cy="14" rx="22" ry="6" fill="none" stroke="'+t+'" stroke-width="2.4"/>',crown:'<path d="M42 30l4-16 8 10 6-14 6 14 8-10 4 16z" fill="'+t+'"/>',horns:'<path d="M38 36C28 30 30 14 40 10c-4 10 2 18 6 22zM82 36c10-6 8-22-2-26 4 10-2 18-6 22z" fill="'+t+'"/>'},B={orbit:'<ellipse cx="60" cy="56" rx="42" ry="12" fill="none" stroke="'+t+'" stroke-width="1.6" stroke-dasharray="2 4" transform="rotate(-18 60 56)"/><circle cx="97" cy="46" r="3" fill="'+t+'"/>',visor:'<rect x="40" y="'+(ey-4)+'" width="40" height="8" rx="4" fill="'+t+'" opacity=".85"/>',brooch:'<path d="M60 96l2.5 5.5 5.5 2.5-5.5 2.5L60 112l-2.5-5.5L52 104l5.5-2.5z" fill="'+c+'" stroke="#fff" stroke-width=".9"/>',paul:'<ellipse cx="20" cy="98" rx="14" ry="8" fill="'+t+'"/><ellipse cx="100" cy="98" rx="14" ry="8" fill="'+t+'"/>'};

function fitHTML(){const c=normTheme(S.theme).split('-'),q=FDt(c[0]),f=Object.assign({c:0,a:1},FIT[c[0]]),nm=(TFAM.filter(x=>x[0]==c[0])[0]||[])[1]||'',fk=MPF.cur();Object.keys(MPF.map).forEach(k=>MPF.load(k));

{const _t=MV.thm;MV.thm=()=>fitHTML()+_t()}

   لإضافة ميزة جديدة مستقبلًا: (1) أضف كائنًا في آخر FEATURES  (2) غيّر APP_VER إلى إصدار أحدث.
   تظهر تلقائيًا: ① كبطاقة "جديد" مع الشرح عند فتح التطبيق  ② ضمن معرفة Moon AI فيعرف كيف تُستخدم.

{v:'2026.11.16-a',t:['٦ ثيمات جديدة','Six new themes','Six nouveaux thèmes'],d:['لكل ثيم لباس داكن وفاتح بتصميم مستقل.','Each with an independent dark and light outfit.','Chacun avec une tenue sombre et claire distincte.'],moon:'Families cel, shd, aur, voi, roy, neo (each with dark and light mode). The user picks them in the theme settings, or Moon switches them instantly with the set_theme op.'},
{v:'2026.11.16-a',t:['شخصيتك بذوقك','Your avatar, your style','Ton avatar, ton style'],d:['ألوان وإكسسوارات متناسقة مع كل ثيم، وثلاثة خطوط للتبديل.','Matching colors, accessories and three fonts to switch.','Couleurs, accessoires et trois polices au choix.'],moon:'In the theme settings under "Customize" the user picks the avatar outfit colour, an accessory, and one of three fonts (IBM Plex, Cairo, Naskh). Moon has no op for these, so guide the user to do it by hand.'},
{v:'2026.11.16-a',t:['Moon AI ينفّذ فعلًا','Moon AI really acts','Moon AI agit vraiment'],d:['إضافة المهام والعادات فورية ومضمونة، مع تأكيد وزر تراجع.','Adding tasks and habits is instant and reliable, with confirmation and undo.','Ajout de tâches et habitudes instantané et fiable, avec annulation.'],moon:'Moon applies requests inside the app at once through its ops, and the app shows a confirmation with an undo button.'},
{v:'2026.11.16-a',t:['انتظار ذكي بلا أخطاء','Smart waiting, no errors','Attente intelligente'],d:['عند الازدحام ينتظر Moon بهدوء ثم يجيب، والمحادثات القديمة تعمل.','When busy, Moon waits quietly then answers; old chats work again.','En cas de charge, Moon patiente puis répond ; les anciens chats refonctionnent.'],moon:'Automatic: when the service is busy Moon waits and retries by itself, so the user does not need to resend.'},
{v:'2026.11.16-b',t:['مقدّمة الجناح المتوهّج','The glowing-wing intro','Intro à l’aile lumineuse'],d:['أول ما تفتح التطبيق يظهر جناح متوهّج يتمايل مع الرياح وتتحرك حوله شظايا وخطوط ضوء.','The app now opens with a glowing wing swaying in the wind, with moving sparks and light streaks.','L’app s’ouvre sur une aile lumineuse qui ondule au vent, avec étincelles et traînées de lumière.'],moon:'A full-screen animated intro plays automatically each time the app opens (shorter for returning users). A tap on the screen skips it. It has no setting and Moon cannot change it.'},
{v:'2026.11.16-b',t:['إشعار الإضافات الجديدة','New-feature notes','Notes des nouveautés'],d:['بعد كل تحديث تظهر لك بطاقة تشرح كل إضافة جديدة عند فتح التطبيق، وMoon AI يعرفها ويشرحها لك.','After each update a card explains every new feature when you open the app, and Moon AI knows them and can explain them.','Après chaque mise à jour, une carte explique chaque nouveauté, et Moon AI les connaît.'],moon:'After every update the app shows a "What\'s new" card on launch. Moon learns each new feature automatically from this same list, so it can explain what is new, what a feature does and where to find it.'},
{v:'2026.11.16-c',t:['الإعلانات حسب الباقة','Ads by plan','Publicités selon le plan'],d:['الباقة المجانية تحتوي على إعلانات، أما بريميوم وبرو فبلا إعلانات إطلاقًا.','The Free plan includes ads, while Premium and Pro have no ads at all.','Le plan Gratuit contient des publicités ; Premium et Pro n’en ont aucune.'],moon:'Free plan shows ads; Premium and Pro are completely ad-free. Plans are only a preview for now: prices and activation dates are not announced, so never promise a price or a date. The user opens the plans screen with the PRO (crown) button in the top bar.'},
{v:'2026.11.16-c',t:['واجهة تناسب كل الشاشات','Fits every screen','S’adapte à tous les écrans'],d:['صار التطبيق بحجم شاشة الهاتف تمامًا بلا تمرير جانبي، ويتكيّف مع الحاسوب والأجهزة الأخرى. وأُزيل زر الثيم من الشريط العلوي، والثيمات في الإعدادات.','The app now fits the phone screen with no sideways scrolling and adapts to computers and other devices. The theme button left the top bar; themes are now in Settings.','L’app tient désormais dans l’écran du téléphone, sans défilement latéral, et s’adapte aux ordinateurs. Le bouton thème a quitté la barre ; les thèmes sont dans Réglages.'],moon:'The top bar no longer has the theme button, so it fits small phones; the PRO (plans) button is still there. Themes are opened from Settings > Themes, and Moon can also change them with the set_theme op. On computers the menu appears as a side panel.'},
{v:'2026.11.16-d',t:['الباقات وكود التفعيل','Plans and activation code','Plans et code d’activation'],d:['بريميوم وبرو بأسعار شهرية وأسبوعية، ويمكن التفعيل بكود من شاشة الاشتراكات.','Premium and Pro with monthly and weekly prices; activate with a code from the Plans screen.','Premium et Pro en mensuel ou hebdo ; activation par code depuis l’écran des abonnements.'],moon:'Plans screen (PRO button): Free gets 1200 credits (about 15 messages); when they run out a real 5-hour countdown starts and the full 1200 returns automatically, Premium 3000 per day plus limited tutor credits, Pro is practically unlimited with daily tutor credits and priority replies. Monthly or weekly billing. Credits depend on message and reply length.'},
{v:'2026.11.16-d',t:['معلّمو اللغات','Language tutors','Tuteurs de langues'],d:['ثلاثة معلّمين للعربية والفرنسية والإنجليزية داخل Moon AI (بريميوم وبرو).','Three tutors for Arabic, French and English inside Moon AI (Premium and Pro).','Trois tuteurs d’arabe, de français et d’anglais dans Moon AI (Premium et Pro).'],moon:'In the Moon AI screen, tap MOON LANGUAGE AI above the chat, pick a language card and tap Start Learning. Premium has a limited tutor credit pool, Pro has daily tutor credits.'},
{v:'2026.11.16-d',t:['دقة أعلى','Higher accuracy','Précision accrue'],d:['Moon يبحث في الإنترنت للمعلومات الحساسة، ويقول «غير متأكد» بدل التخمين.','Moon searches the web for factual questions and says “not sure” instead of guessing.','Moon cherche sur le web et dit « pas sûr » plutôt que de deviner.'],moon:'Moon answers factual questions from web search when possible and flags uncertainty explicitly.'},
{v:'2026.11.16-d',t:['الجناح الحيّ','The living wing','L’aile vivante'],d:['في المقدّمة صارت كل ريشة تتحرك بإيقاعها مع شظايا وشرارات أكثر.','In the intro every feather now moves on its own rhythm, with more shards and sparks.','Dans l’intro chaque plume bouge à son rythme, avec plus d’éclats et d’étincelles.']},
{v:'2026.11.16-e',t:['مقارنة الباقات والأسعار','Plans and prices comparison','Comparatif des plans et prix'],d:['شاشة ترحيبية توضّح الفروق بين المجاني وبريميوم وبرو مع الأسعار الشهرية والأسبوعية، وجدول مقارنة تفصيلي.','A welcome screen explains the differences between Free, Premium and Pro with monthly and weekly prices, plus a detailed comparison table.','Un écran d’accueil explique les différences entre Gratuit, Premium et Pro avec les prix mensuels et hebdomadaires, et un tableau comparatif.'],moon:'The plans screen opens once at first start and any time from the PRO button at the top. It shows monthly and weekly prices and a comparison table of Free, Premium and Pro.'},
{v:'2026.11.16-f',t:['العمل بدون إنترنت','Offline awareness','Mode hors ligne'],d:['إشعار أنيق عند انقطاع الاتصال، وتصفّح محادثات Moon المحفوظة كالمعتاد، ومنع الإرسال بدون إنترنت مع زر إعادة المحاولة. والرصيد صار نجمة متوهجة.','An elegant notice when offline, saved Moon chats stay readable, sending is paused without internet with a Retry button, and credits now show as a glowing sparkle.','Un bandeau élégant hors ligne, les chats Moon enregistrés restent lisibles, l’envoi est suspendu sans internet avec un bouton Réessayer, et les crédits s’affichent en étoile lumineuse.'],moon:'When offline the app shows a notice; you can still read saved Moon chats, but sending is blocked until the connection returns. If a request fails, tap Retry under the message.'},
{v:'2026.11.17-a',t:['مدرب رياضي أذكى','Smarter sports coach','Coach sportif plus malin'],d:['يفهم Moon رسائلك الرياضية القصيرة ويعدّل جدولك دون إعادة بنائه: استبدال تمرين، تخفيف الحجم، نقل يوم، تغيير المعدات، إضافة مرونة. ويحلّل خطة تلصقها نصًا.','Moon understands short sports messages and edits your plan without rebuilding it: swap an exercise, lower volume, move a day, change equipment, add mobility. It also analyses a plan you paste as text.','Moon comprend tes messages sportifs courts et modifie ton plan sans le refaire : échange d’exercice, volume, déplacement d’un jour, matériel, mobilité. Il analyse aussi un plan collé en texte.'],moon:'Plan edits run through ops plan_swap, plan_volume, plan_move, plan_mobility, plan_equipment. Pasted text plans are analysed by the app. Pictures cannot be read.'},
{v:'2026.11.17-b',t:['رحلة التعلّم للغات','Language learning path','Parcours d’apprentissage'],d:['اختبار تحديد المستوى، خطة شخصية، دروس تفاعلية، تمارين ذكية بتصحيح وشرح، محادثات واقعية، تتبّع التقدّم وتحدٍّ أسبوعي مع كل معلّم لغة (بريميوم وبرو).','Placement test, personal plan, interactive lessons, smart exercises with corrections, real-life conversations, progress tracking and a weekly challenge with each language tutor (Premium and Pro).','Test de niveau, plan personnel, leçons interactives, exercices avec corrections, conversations réelles, suivi et défi hebdomadaire avec chaque tuteur (Premium et Pro).'],moon:'In a language tutor mode (Arabic, French or English) tap the Learning path button above the chat: placement test, personal plan, interactive lessons, smart exercises, conversation practice, progress and a weekly challenge. Progress is saved to the account. Premium and Pro only; it uses the same tutor credits.'},
{v:'2026.11.17-c',t:['MOON LANGUAGE AI','MOON LANGUAGE AI','MOON LANGUAGE AI'],d:['معلّم لغات واحد موحّد داخل Moon AI: اختر الإنجليزية أو الفرنسية أو العربية من بطاقات أنيقة، ويُحفظ تقدّم كل لغة بشكل مستقل (بريميوم وبرو).','One unified language tutor inside Moon AI: pick English, French or Arabic from clean cards, and each language keeps its own progress (Premium and Pro).','Un seul tuteur de langues dans Moon AI : choisis l’anglais, le français ou l’arabe sur des cartes, chaque langue garde sa progression (Premium et Pro).'],moon:'In the Moon AI screen, tap MOON LANGUAGE AI, choose English, Français or العربية on a card and tap Start Learning. The globe button reopens the cards and the language chips switch language without losing the other languages progress. Premium and Pro only.'},
{v:'2026.11.20-a',t:['ربط المعلّم بمسار التعلّم','Tutor linked to your learning path','Tuteur relié à ton parcours'],d:['المعلّم الذكي يعرف مستواك وخطتك ونقاط ضعفك، تتحوّل تصحيحاته إلى نقاط ضعف في التمارين، ويقترح عليك دروسًا بزر «افتح الدرس».','The AI tutor knows your level, plan and weak points; its corrections feed your exercises and it suggests lessons with an Open lesson button.','Le tuteur IA connaît ton niveau, ton plan et tes points faibles ; ses corrections alimentent tes exercices et il propose des leçons avec un bouton.'],moon:'In a language tutor chat, corrections are saved as weak topics and shown in Exercises. When the tutor suggests a lesson, tap Open lesson or Exercises under its reply. Inside the Learning path, tap Ask the tutor in Moon AI to return to the chat.'}
