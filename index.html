<div class="lg">${[['1–7',0],['8–30',1],['31–90',2],['91+',3]].map(x=>`<span><i style="background:${TR[x[1]].c}"></i>${x[0]} ${TR[x[1]].n}</span>`).join('')}</div></div>`};
const skc=()=>`<div class="g4" style="grid-template-columns:repeat(2,1fr)"><div class="card st"><b>${I('flame')} ${CK.c}</b><small>السلسلة الحالية (يوم)</small></div><div class="card st"><b>${CK.b}</b><small>أطول سلسلة (يوم)</small></div></div>`;
/* ---- Notes ---- */
const dtf=t=>new Date(t).toLocaleString('ar-EG-u-nu-latn',{dateStyle:'medium',timeStyle:'short'});
const nl=()=>{const q=NQ.trim().toLowerCase(),L=S.notes.filter(n=>!q||(n.t+' '+n.c).toLowerCase().includes(q)).sort((a,b)=>b.u-a.u);return L.map(n=>`<button class="ex nt" data-a="nopen" data-id="${n.id}"><div><b>${esc(n.t||'بدون عنوان')}</b><span class="mu">${esc(n.c.slice(0,90))}</span><span class="mu">${dtf(n.u)}</span></div>${I('cl')}</button>`).join('')||`<p class="mu c">${q?'لا نتائج مطابقة.':'لا توجد ملاحظات بعد.'}</p>`};
V.notes=()=>`<div class="card"><div class="row"><input data-i="ns" placeholder="ابحث في الملاحظات…" value="${esc(NQ)}" style="flex:1"><button class="btn" data-a="nnew">${I('plus')} ملاحظة</button></div><div id="nl">${nl()}</div></div>`;
MV.nt=()=>{const n=S.notes.find(x=>x.id==M.id);if(!n)return'';return`<div class="ed"><input data-i="nt" class="edt" value="${esc(n.t)}" placeholder="العنوان"><textarea data-i="nb" class="edb" placeholder="اكتب ملاحظتك…">${esc(n.c)}</textarea><div class="row sb mu"><span>أُنشئت ${dtf(n.d)} · آخر تعديل <span id="nu">${dtf(n.u)}</span></span><button class="btn dg sm" data-a="ndel">${I('trash')} حذف</button></div></div>`};
MV.rv=()=>{const k=wk0(sel);return`<div class="ed"><h3>المراجعة الأسبوعية</h3><p class="mu">${fmt(k,{day:'numeric',month:'long'})} – ${fmt(add(k,6),{day:'numeric',month:'long'})}</p><textarea data-i="rvb" class="edb" placeholder="ما الذي نجح؟ وما الذي ستحسّنه؟">${esc(S.rev[k]||'')}</textarea></div>`};
/* ---- Google ---- */
const CF=()=>{try{return JSON.parse(localStorage.getItem('mp_cfg'))||{}}catch(e){return{}}},DR='https://www.googleapis.com';
async function api(p,o={}){const c=CF();if(!/^https:\/\/|^http:\/\/localhost/.test(c.api||''))throw new Error('رابط الخادم غير صحيح (يلزم HTTPS)');const r=await fetch(c.api.replace(/\/$/,'')+p,{...o,headers:{'Content-Type':'application/json',...(AU.tok?{Authorization:'Bearer '+AU.tok}:{})}});if(!r.ok)throw new Error('خطأ '+r.status);return r.json()}
async function dfetch(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+AU.tok,...(o.headers||{})}});if(!r.ok)throw new Error('خطأ '+r.status);return r}
const dfile=async()=>{const r=await(await dfetch(DR+'/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='my-progress.json'"))).json();return r.files&&r.files[0]&&r.files[0].id};
async function rget(){if(CF().api)return api('/sync');const id=await dfile();if(!id)return{data:null,updated:0};const d=await(await dfetch(DR+'/drive/v3/files/'+id+'?alt=media')).json();return{data:d,updated:d.mt||0}}
async function rput(){if(CF().api)return api('/sync',{method:'PUT',body:JSON.stringify({data:S,updated:S.mt||Date.now()})});let id=await dfile();if(!id)id=(await(await dfetch(DR+'/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'my-progress.json',parents:['appDataFolder']})})).json()).id;await dfetch(DR+'/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)})}
const push=()=>sync(true);
let SY=Promise.resolve();const sync=q=>SY=SY.then(()=>sync0(q),()=>sync0(q));
async function sync0(q){if(!AU.tok)return;try{const r=await rget();if(r.data&&r.updated>(S.mt||0)){S=Object.assign(def(),r.data);mig();S.mt=r.updated;save(1);applyTheme();render();toast('تم تنزيل أحدث بياناتك من السحابة')}else{await rput();if(!q)toast('تمت المزامنة')}}catch(e){if(/401|403/.test(e.message)){AU={};try{localStorage.removeItem('mp_auth')}catch(x){}toast('انتهت جلسة Google، سجّل الدخول من جديد');render()}else if(!q)toast('تعذرت المزامنة: '+e.message)}}
const loadGsi=()=>new Promise((ok,no)=>{if(window.google&&google.accounts)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('تعذر تحميل خدمة Google. استضف الملف على نطاقك عبر HTTPS'));document.head.appendChild(s)});
function login(j){AU=j;try{localStorage.setItem('mp_auth',JSON.stringify(AU))}catch(e){}toast('تم تسجيل الدخول');return sync().then(render)}
function gsi(){const c=CF();if(c.api){google.accounts.id.initialize({client_id:c.clientId,callback:async r=>{try{const j=await api('/auth/google',{method:'POST',body:JSON.stringify({credential:r.credential})});await login({tok:j.token,email:j.email,name:j.name})}catch(e){toast(e.message)}}});google.accounts.id.renderButton($('#gb'),{theme:'outline',size:'large',locale:'ar'});toast('اضغط زر Google الرسمي');return}
google.accounts.oauth2.initTokenClient({client_id:c.clientId,scope:'https://www.googleapis.com/auth/drive.appdata openid email',callback:async r=>{if(r.error||!r.access_token){toast('لم يكتمل تسجيل الدخول');return}AU={tok:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};try{AU.email=(await(await dfetch(DR+'/oauth2/v3/userinfo')).json()).email}catch(e){}await login(AU)}}).requestAccessToken()}
Object.assign(A,{nnew:()=>{const n={id:uid(),t:'',c:'',d:Date.now(),u:Date.now()};S.notes.push(n);save();M={k:'nt',id:n.id,nw:1};mrender()},nopen:d=>{M={k:'nt',id:d.id};mrender()},ndel:()=>{S.notes=S.notes.filter(x=>x.id!=M.id);M=null;save();mrender();render()},rvo:()=>{M={k:'rv'};mrender()},
gin:()=>{if(!CF().clientId){toast('أدخل Google Client ID أولًا');return}if(!(window.google&&google.accounts)){loadGsi().then(()=>toast('جاهز، اضغط الزر مرة أخرى')).catch(e=>toast(e.message));return}gsi()},
gout:()=>{try{if(AU.tok&&window.google&&google.accounts&&!CF().api)google.accounts.oauth2.revoke(AU.tok)}catch(e){}AU={};try{localStorage.removeItem('mp_auth')}catch(e){}render()},sync:()=>sync()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,n=f.dataset.f,d=Object.fromEntries(new FormData(f)),v=(d.v||'').trim();
if(n=='cfg'){S.wcfg[M.id]={s:Math.max(1,+d.s||1),r:Math.max(1,+d.r||1),rest:Math.max(0,+d.q||0)};M.edit=0;save();mrender();render();toast('تم حفظ التعديل');return}
if(n=='hed'){const h=S.habits.find(h=>h.id==M.id);if(v)h.n=v;h.i=d.i||h.i;if(h.t=='fc')h.g=Math.max(1,+d.g||180);save();M=null;mrender();render();toast('تم الحفظ');return}
if(!v)return;if(n=='task')(S.tasks[sel]=S.tasks[sel]||[]).push({id:uid(),t:v,d:false});else if(n=='habit')S.habits.push({id:uid(),n:v,i:d.i||'star',t:'ck'});else if(n=='wo')S.wo.push({id:uid(),n:v,s:Math.max(1,+d.s||1),r:Math.max(1,+d.r||1)});
save();render();const i=$('#m input[name=v]');if(i)i.focus()});
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(i=='name'){S.name=e.target.value;save()}else if(i=='rev'){S.rev[wk0(sel)]=e.target.value;save()}else if(i=='nt'||i=='nb'){const n=S.notes.find(x=>x.id==M.id);if(n){n[i=='nt'?'t':'c']=e.target.value;n.u=Date.now();save();$('#nsv').textContent='تم الحفظ تلقائيًا';$('#nu').textContent=dtf(n.u)}}else if(i=='rvb'){S.rev[wk0(sel)]=e.target.value;save();$('#nsv').textContent='تم الحفظ تلقائيًا'}else if(i=='ns'){NQ=e.target.value;$('#nl').innerHTML=nl()}else if(i=='cid'||i=='cap'){const c=CF();c[i=='cid'?'clientId':'api']=e.target.value.trim();try{localStorage.setItem('mp_cfg',JSON.stringify(c))}catch(x){}}else if(i=='df'||i=='db'){const m=i=='df'?'f':'b',v=Math.min(i=='df'?180:60,Math.max(1,+e.target.value||1));S.fcfg[m]=v;save();if(!T.run&&T.m==m){T.left=v*60;upd()}}});
document.addEventListener('change',e=>{if(e.target.id=='fi'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f);e.target.value=''}});
$('#lg').innerHTML=I('leaf')+'MY PROGRESS';
$('#nv').innerHTML=NAV.map(x=>`<button data-a="go" data-v="${x[0]}">${I(x[1])}${x[2]}</button>`).join('');
applyTheme();render();if(AU.tok)sync();
if(window.visualViewport){visualViewport.addEventListener('resize',vv);visualViewport.addEventListener('scroll',vv)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TODAY()!==DAY){DAY=TODAY();sel=DAY;render()}});
setInterval(()=>{const g=$('#gr'),d=$('#dt');if(g)g.textContent=greet(new Date().getHours())+(S.name?'، '+S.name:'');if(d)d.textContent=fmt(TODAY(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})},60000);
</script>
